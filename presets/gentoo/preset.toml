# Stock Gentoo preset — the reference implementation.
# Deliberately minimal: zero locks, no extra steps; ships the three
# package tiers (minimal / cosmic / cosmic-full via the cosmic overlay).

[preset]
id         = "gentoo"
name       = "Gentoo"
version    = "1.0.0"
engine_min = "0.1.0"

[branding]
product_name = "Gentoo"
accent       = "#6e56cf"          # gentoo purple
dark_default = true
support_url  = "https://wiki.gentoo.org/wiki/Handbook:Main_Page"

[welcome]
tagline    = "Welcome to Gentoo."
notice_url = "https://www.gentoo.org/news/"

# No [defaults] overlay — engine defaults are the Gentoo defaults.
# No [locks] — every choice stays user-visible.

[express]
enabled       = true
fields_shown  = ["disk.device", "confirm"]

[[repos]]
name     = "cosmic"
sync_uri = ""                    # empty = eselect repository enable

[[package_sets]]
id          = "minimal"
label       = "Minimal"
description = "bootable base: kernel, init, portage, network"
atoms       = []
default     = true

[[package_sets]]
id          = "cosmic"
label       = "COSMIC (minimal)"
description = "COSMIC session: compositor, greeter, seat stack"
repos       = ["cosmic"]
atoms       = ["cosmic-de/cosmic-meta", "media-libs/pipewire",
               "gui-apps/turnstile", "sys-auth/seatd", "sys-apps/dbus"]
default     = false

[[package_sets]]
id          = "cosmic-full"
label       = "COSMIC (full)"
description = "minimal COSMIC + apps: files, terminal, editor, store"
repos       = ["cosmic"]
atoms       = ["cosmic-de/cosmic-meta", "cosmic-de/cosmic-apps",
               "media-libs/pipewire", "gui-apps/turnstile",
               "sys-auth/seatd", "sys-apps/dbus"]
extends     = "cosmic"
default     = false
